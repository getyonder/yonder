<text x="1010" y="222" font-size="12" text-anchor="middle" fill="#5b6478" font-weight="500">web app</text>
<polyline points="310,330 310,232 155,232 155,180" fill="none" stroke="#5b6478" stroke-width="1.8" stroke-dasharray="2 5" stroke-linejoin="round"/>
<polygon points="155,180 159.5,190.0 150.5,190.0" fill="#5b6478"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 724" width="1100" height="724" role="img" aria-label="Yonder system overview: two networks, the devices in them, and the three parts of Yonder's back end" font-family="Figtree, Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>Yonder system overview: two networks, the devices in them, and the three parts of Yonder's back end</title>
<rect width="1100" height="724" rx="12" fill="#f6f7fb"/>
<text x="550" y="26" font-size="12" text-anchor="middle" fill="#5b6478" font-weight="400" font-style="italic">The parts on servers. Each can be on a server of its own.</text>
<rect x="30" y="40" width="250" height="140" rx="8" fill="#fdf1dc" stroke="#b45309" stroke-width="1.5"/>
<text x="155.0" y="85.0" font-size="13.5" text-anchor="middle" fill="#b45309" font-weight="650">Website</text>
<text x="155.0" y="101.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">getyonder.org</text>
<text x="155.0" y="116.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">pages only: plain files;</text>
<text x="155.0" y="131.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">no Yonder needs it.</text>
<text x="155.0" y="146.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">Its homepage asks /status.json</text>
<rect x="330" y="40" width="370" height="140" rx="8" fill="#fdf1dc" stroke="#b45309" stroke-width="1.5"/>
<text x="515.0" y="85.0" font-size="13.5" text-anchor="middle" fill="#b45309" font-weight="650">Application server  (yonder-api)</text>
<text x="515.0" y="101.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">api.getyonder.org</text>
<text x="515.0" y="116.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the service: meeting point,</text>
<text x="515.0" y="131.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">list of relays, update check;</text>
<text x="515.0" y="146.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">/status.json and /opened</text>
<rect x="740" y="40" width="330" height="140" rx="8" fill="#fdf1dc" stroke="#b45309" stroke-width="1.5"/>
<text x="905.0" y="85.0" font-size="13.5" text-anchor="middle" fill="#b45309" font-weight="650">The web app's files</text>
<text x="905.0" y="101.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">app.getyonder.org</text>
<text x="905.0" y="116.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">plain files;</text>
<text x="905.0" y="131.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the page calls the service</text>
<text x="905.0" y="146.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">by its name, as the apps do</text>
<polyline points="280,150 330,150" fill="none" stroke="#5b6478" stroke-width="1.8" stroke-dasharray="2 5" stroke-linejoin="round"/>
<polygon points="330,150 320.0,154.5 320.0,145.5" fill="#5b6478"/>
<rect x="400" y="555" width="300" height="100" rx="8" fill="#fdf1dc" stroke="#b45309" stroke-width="1.5"/>
<text x="550.0" y="587.5" font-size="13.5" text-anchor="middle" fill="#b45309" font-weight="650">Relay  (derper)</text>
<text x="550.0" y="603.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">relay.getyonder.org</text>
<text x="550.0" y="618.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">passes encrypted packets;</text>
<text x="550.0" y="633.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">keeps none</text>
<rect x="30" y="280" width="440" height="150" rx="10" fill="#eceff6" stroke="#8a93a8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="50" y="304" font-size="13" text-anchor="start" fill="#5b6478" font-weight="650">Network A</text>
<rect x="640" y="280" width="430" height="150" rx="10" fill="#eceff6" stroke="#8a93a8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="660" y="304" font-size="13" text-anchor="start" fill="#5b6478" font-weight="650">Network B</text>
<rect x="45" y="330" width="160" height="64" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5"/>
<text x="125.0" y="359.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">LocalSend app</text>
<text x="125.0" y="375.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">not Yonder</text>
<rect x="285" y="330" width="170" height="64" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="370.0" y="359.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">Yonder app A</text>
<text x="370.0" y="375.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">desktop</text>
<rect x="655" y="330" width="160" height="64" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="735.0" y="359.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">Yonder app B</text>
<text x="735.0" y="375.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">desktop</text>
<rect x="895" y="330" width="160" height="64" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="975.0" y="359.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">Yonder web app</text>
<text x="975.0" y="375.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">in a browser</text>
<polyline points="205,362 285,362" fill="none" stroke="#0f7a55" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="285,362 275.0,366.5 275.0,357.5" fill="#0f7a55"/>
<polygon points="205,362 215.0,357.5 215.0,366.5" fill="#0f7a55"/>
<text x="245" y="412" font-size="11.5" text-anchor="middle" fill="#0f7a55" font-weight="500">LocalSend protocol, found by multicast</text>
<polyline points="455,362 655,362" fill="none" stroke="#4f46e5" stroke-width="2.4" stroke-linejoin="round"/>
<polygon points="655,362 645.0,366.5 645.0,357.5" fill="#4f46e5"/>
<polygon points="455,362 465.0,357.5 465.0,366.5" fill="#4f46e5"/>
<rect x="485.15999999999997" y="339" width="139.68" height="19" fill="#f6f7fb"/>
<text x="555" y="354" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">tunnel, direct path</text>
<text x="555" y="384" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">files between two apps</text>
<text x="555" y="399" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">go this way only</text>
<polyline points="400,330 400,180" fill="none" stroke="#5b6478" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round"/>
<polygon points="400,180 404.5,190.0 395.5,190.0" fill="#5b6478"/>
<polygon points="400,330 395.5,320.0 404.5,320.0" fill="#5b6478"/>
<rect x="316.72" y="220" width="166.56" height="34" fill="#f6f7fb"/>

<text x="400" y="250" font-size="12" text-anchor="middle" fill="#5b6478" font-weight="500">the same public address</text>
<polyline points="925,330 925,232 650,232 650,180" fill="none" stroke="#5b6478" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round"/>
<polygon points="650,180 654.5,190.0 645.5,190.0" fill="#5b6478"/>

<rect x="981.96" y="560" width="106.08000000000001" height="34" fill="#f6f7fb"/>
<text x="1035" y="575" font-size="12" text-anchor="middle" fill="#b45309" font-weight="500">to find each</text>
<text x="1035" y="590" font-size="12" text-anchor="middle" fill="#b45309" font-weight="500">other; no file</text>
<rect x="795" y="470" width="215" height="84" rx="8" fill="#fdf1dc" stroke="#b45309" stroke-width="1.5"/>
<text x="902.5" y="494.5" font-size="13.5" text-anchor="middle" fill="#b45309" font-weight="650">STUN server  (yonder-stun)</text>
<text x="902.5" y="510.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">stun.getyonder.org, UDP 3479</text>
<text x="902.5" y="525.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">tells a device its public</text>
<text x="902.5" y="540.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">address; keeps none</text>
<polyline points="805,394 805,470" fill="none" stroke="#5b6478" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="805,470 800.5,460.0 809.5,460.0" fill="#5b6478"/>

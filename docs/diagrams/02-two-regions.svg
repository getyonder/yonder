<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" role="img" aria-label="One meeting point and relays by region: a person in Japan and a person in the United Kingdom" font-family="Figtree, Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>One meeting point and relays by region: a person in Japan and a person in the United Kingdom</title>
<rect width="1100" height="600" rx="12" fill="#f6f7fb"/>
<rect x="400" y="30" width="300" height="112" rx="8" fill="#fdf1dc" stroke="#b45309" stroke-width="1.5"/>
<text x="550.0" y="61.0" font-size="13.5" text-anchor="middle" fill="#b45309" font-weight="650">Application server</text>
<text x="550.0" y="77.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">api.getyonder.org</text>
<text x="550.0" y="92.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the one meeting point: nearby</text>
<text x="550.0" y="107.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">devices and rooms; the list of</text>
<text x="550.0" y="122.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">relays; the update check</text>
<rect x="810" y="30" width="260" height="66" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="940.0" y="60.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">Website  (getyonder.org)</text>
<text x="940.0" y="76.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">pages only; not used here</text>
<rect x="30" y="200" width="260" height="200" rx="10" fill="#eceff6" stroke="#8a93a8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="50" y="224" font-size="13" text-anchor="start" fill="#5b6478" font-weight="650">Japan</text>

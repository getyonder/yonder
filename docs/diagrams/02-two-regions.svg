<text x="160.0" y="318.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">of the person in Japan</text>
<rect x="810" y="200" width="260" height="200" rx="10" fill="#eceff6" stroke="#8a93a8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="830" y="224" font-size="13" text-anchor="start" fill="#5b6478" font-weight="650">United Kingdom</text>

<text x="940.0" y="302.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">Yonder app</text>
<text x="940.0" y="318.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">of the person in the UK</text>
<rect x="330" y="255" width="190" height="100" rx="8" fill="#fdf1dc" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="425.0" y="287.5" font-size="13.5" text-anchor="middle" fill="#b45309" font-weight="650">A relay near Japan</text>
<text x="425.0" y="303.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">an example only:</text>
<text x="425.0" y="318.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">at this time, no such</text>
<text x="425.0" y="333.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">relay exists</text>
<rect x="580" y="255" width="190" height="100" rx="8" fill="#fdf1dc" stroke="#b45309" stroke-width="1.5"/>
<text x="675.0" y="287.5" font-size="13.5" text-anchor="middle" fill="#b45309" font-weight="650">Main relay</text>
<text x="675.0" y="303.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">relay.getyonder.org</text>
<text x="675.0" y="318.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">at this time,</text>
<text x="675.0" y="333.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the only relay</text>
<polyline points="260,305 330,305" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="330,305 320.0,309.5 320.0,300.5" fill="#b45309"/>
<polygon points="260,305 270.0,300.5 270.0,309.5" fill="#b45309"/>
<polyline points="840,305 770,305" fill="none" stroke="#b45309" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="770,305 780.0,300.5 780.0,309.5" fill="#b45309"/>
<polygon points="840,305 830.0,309.5 830.0,300.5" fill="#b45309"/>
<text x="550" y="384" font-size="11.5" text-anchor="middle" fill="#b45309" font-weight="400">Each app has a home relay: the nearest relay in the list.</text>
<text x="550" y="399" font-size="11.5" text-anchor="middle" fill="#b45309" font-weight="400">A tunnel connection starts through a relay.</text>
<polyline points="160,270 160,86 400,86" fill="none" stroke="#5b6478" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round"/>
<polygon points="400,86 390.0,90.5 390.0,81.5" fill="#5b6478"/>
<polygon points="160,270 155.5,260.0 164.5,260.0" fill="#5b6478"/>

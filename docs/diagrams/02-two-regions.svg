<text x="160" y="151" font-size="12" text-anchor="middle" fill="#5b6478" font-weight="500">names, room code,</text>
<text x="160" y="166" font-size="12" text-anchor="middle" fill="#5b6478" font-weight="500">key agreement</text>
<polyline points="940,270 940,122 700,122" fill="none" stroke="#5b6478" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round"/>
<polygon points="700,122 710.0,117.5 710.0,126.5" fill="#5b6478"/>
<polygon points="940,270 935.5,260.0 944.5,260.0" fill="#5b6478"/>
<rect x="866.8" y="145" width="146.4" height="49" fill="#f6f7fb"/>
<text x="940" y="160" font-size="12" text-anchor="middle" fill="#5b6478" font-weight="500">small messages only:</text>
<text x="940" y="175" font-size="12" text-anchor="middle" fill="#5b6478" font-weight="500">names, room code,</text>
<text x="940" y="190" font-size="12" text-anchor="middle" fill="#5b6478" font-weight="500">key agreement</text>
<polyline points="160,340 160,480 940,480 940,340" fill="none" stroke="#4f46e5" stroke-width="2.4" stroke-linejoin="round"/>
<polygon points="940,340 944.5,350.0 935.5,350.0" fill="#4f46e5"/>
<polygon points="160,340 164.5,350.0 155.5,350.0" fill="#4f46e5"/>
<rect x="372.64" y="442" width="354.72" height="34" fill="#f6f7fb"/>
<text x="550" y="457" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">the files: tunnel, direct path between the two apps</text>
<text x="550" y="472" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">no server of Yonder carries them</text>
<text x="550" y="520" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400" font-style="italic">With a web app at one end, the files go on a data channel, which is also direct (section 8).</text>
<line x1="40" y1="570" x2="74" y2="570" stroke="#5b6478" stroke-width="2.4" stroke-dasharray="6 4"/>
<text x="82" y="574" font-size="12" text-anchor="start" fill="#1f2433" font-weight="400">meeting point, in one location</text>
<line x1="313.6" y1="570" x2="347.6" y2="570" stroke="#b45309" stroke-width="2.4"/>
<text x="355.6" y="574" font-size="12" text-anchor="start" fill="#1f2433" font-weight="400">relay, by region</text>
<line x1="493.12" y1="570" x2="527.12" y2="570" stroke="#4f46e5" stroke-width="2.4"/>
<text x="535.12" y="574" font-size="12" text-anchor="start" fill="#1f2433" font-weight="400">tunnel, direct</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" role="img" aria-label="The layers that carry a file, on the local network and through the tunnel" font-family="Figtree, Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>The layers that carry a file, on the local network and through the tunnel</title>
<rect width="880" height="400" rx="12" fill="#f6f7fb"/>
<rect x="40" y="30" width="800" height="62" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="440.0" y="58.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">LocalSend protocol</text>
<text x="440.0" y="74.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">HTTP requests: /info, /register, /prepare-upload, /upload, /cancel</text>
<rect x="40" y="104" width="800" height="62" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="440.0" y="132.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">TLS</text>
<text x="440.0" y="148.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">each device has a self-signed certificate; its fingerprint is the identity of the device</text>
<rect x="40" y="178" width="300" height="62" rx="8" fill="#e3f5ec" stroke="#0f7a55" stroke-width="1.5"/>
<text x="190.0" y="206.5" font-size="13.5" text-anchor="middle" fill="#0f7a55" font-weight="650">Local network</text>
<text x="190.0" y="222.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">TCP, port 53317 (or 53318)</text>
<rect x="352" y="178" width="488" height="62" rx="8" fill="#ecebff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="596.0" y="206.5" font-size="13.5" text-anchor="middle" fill="#4f46e5" font-weight="650">Tunnel (tailcat)</text>
<text x="596.0" y="222.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">WireGuard; only permitted keys connect; port 53317 in the tunnel</text>
<rect x="352" y="252" width="238" height="62" rx="8" fill="#ecebff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="471.0" y="280.5" font-size="13.5" text-anchor="middle" fill="#4f46e5" font-weight="650">Direct path</text>
<text x="471.0" y="296.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">UDP between the two devices</text>
<rect x="602" y="252" width="238" height="62" rx="8" fill="#fdf1dc" stroke="#b45309" stroke-width="1.5"/>
<text x="721.0" y="280.5" font-size="13.5" text-anchor="middle" fill="#b45309" font-weight="650">Relay</text>
<text x="721.0" y="296.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">TLS to relay.getyonder.org, port 443</text>
<text x="190" y="268" font-size="12" text-anchor="middle" fill="#5b6478" font-weight="400">Yonder apps and LocalSend</text>
<text x="190" y="284" font-size="12" text-anchor="middle" fill="#5b6478" font-weight="400">apps on one network</text>
<text x="471" y="338" font-size="12" text-anchor="middle" fill="#5b6478" font-weight="400">two Yonder apps</text>
<text x="721" y="338" font-size="12" text-anchor="middle" fill="#5b6478" font-weight="400">a browser at one end, and the</text>
<text x="721" y="354" font-size="12" text-anchor="middle" fill="#5b6478" font-weight="400">start of each tunnel connection</text>
<text x="440" y="384" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400" font-style="italic">The top two layers are the same in each column. Thus one receiver handles all senders.</text>
</svg>

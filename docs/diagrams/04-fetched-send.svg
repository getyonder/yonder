<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 989" width="920" height="989" role="img" aria-label="The fetched send: the receiver gets the files on its own connection" font-family="Figtree, Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>The fetched send: the receiver gets the files on its own connection</title>
<rect width="920" height="989" rx="12" fill="#f6f7fb"/>
<line x1="230" y1="66" x2="230" y2="967" stroke="#8a93a8" stroke-width="1.2" stroke-dasharray="3 4"/>
<line x1="690" y1="66" x2="690" y2="967" stroke="#8a93a8" stroke-width="1.2" stroke-dasharray="3 4"/>
<rect x="120" y="18" width="220" height="50" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="230.0" y="40.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">Device A</text>
<text x="230.0" y="56.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the sender</text>
<rect x="580" y="18" width="220" height="50" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="690.0" y="40.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">Device B</text>
<text x="690.0" y="56.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the receiver</text>
<rect x="110" y="100" width="700" height="44" rx="6" fill="#ffffff" stroke="#8a93a8" stroke-width="1.2"/>
<text x="460.0" y="119" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">Amber, dashed: the connection of A to B, which is on the relay. It carries no data about the files.</text>
<text x="460.0" y="134" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">Indigo: the connection of B to A, which is direct. It carries the list of files and the files.</text>
<polyline points="230,183 690,183" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round"/>
<polygon points="690,183 680.0,187.5 680.0,178.5" fill="#b45309"/>
<rect x="423.76" y="160" width="72.48" height="19" fill="#f6f7fb"/>
<text x="460.0" y="175" font-size="12" text-anchor="middle" fill="#b45309" font-weight="500">GET /info</text>
<polyline points="690,224 230,224" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round"/>
<polygon points="230,224 240.0,219.5 240.0,228.5" fill="#b45309"/>
<rect x="326.32" y="201" width="267.36" height="19" fill="#f6f7fb"/>
<text x="460.0" y="216" font-size="12" text-anchor="middle" fill="#b45309" font-weight="500">reply, with the header Yonder-Fetch: 1</text>
<polyline points="230,265 690,265" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round"/>
<polygon points="690,265 680.0,269.5 680.0,260.5" fill="#b45309"/>
<rect x="302.79999999999995" y="242" width="314.40000000000003" height="19" fill="#f6f7fb"/>
<text x="460.0" y="257" font-size="12" text-anchor="middle" fill="#b45309" font-weight="500">GET /info, with the header Yonder-Fetch: look</text>
<rect x="555.04" y="283" width="269.9200000000001" height="44" rx="6" fill="#ffffff" stroke="#8a93a8" stroke-width="1.2"/>
<text x="690.0" y="302" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">Connect to A. Look for a direct path</text>
<text x="690.0" y="317" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">for a maximum of 10 seconds.</text>
<rect x="58.079999999999984" y="343" width="343.84000000000003" height="44" rx="6" fill="#ffffff" stroke="#8a93a8" stroke-width="1.2"/>
<text x="230.0" y="362" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">Examine the two connections for a maximum of</text>
<text x="230.0" y="377" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">10 seconds. Only the connection of B is direct.</text>
<polyline points="230,441 690,441" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round"/>
<polygon points="690,441 680.0,445.5 680.0,436.5" fill="#b45309"/>
<rect x="336.4" y="403" width="247.20000000000002" height="34" fill="#f6f7fb"/>
<text x="460.0" y="418" font-size="12" text-anchor="middle" fill="#b45309" font-weight="500">POST /prepare-upload with no files,</text>
<text x="460.0" y="433" font-size="12" text-anchor="middle" fill="#b45309" font-weight="500">with the header Yonder-Fetch: &lt;id&gt;</text>
<rect x="524.8" y="459" width="330.4000000000001" height="29" rx="6" fill="#ffffff" stroke="#8a93a8" stroke-width="1.2"/>
<text x="690.0" y="478" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">Make sure that the connection to A is direct.</text>
<polyline points="690,527 230,527" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="230,527 240.0,522.5 240.0,531.5" fill="#4f46e5"/>
<rect x="329.68" y="504" width="260.64" height="19" fill="#f6f7fb"/>
<text x="460.0" y="519" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">POST /prepare-download?sessionId=&lt;id&gt;</text>
<polyline points="230,568 690,568" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="690,568 680.0,572.5 680.0,563.5" fill="#4f46e5"/>
<rect x="373.36" y="545" width="173.28000000000003" height="19" fill="#f6f7fb"/>
<text x="460.0" y="560" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">reply: the list of files</text>
<rect x="578.56" y="586" width="222.8800000000001" height="44" rx="6" fill="#ffffff" stroke="#8a93a8" stroke-width="1.2"/>
<text x="690.0" y="605" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">Apply the limits to the list.</text>
<text x="690.0" y="620" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">Ask the owner.</text>
<polyline points="690,684 230,684" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round"/>
<polygon points="230,684 240.0,679.5 240.0,688.5" fill="#b45309"/>
<rect x="286.0" y="646" width="348.00000000000006" height="34" fill="#f6f7fb"/>
<text x="460.0" y="661" font-size="12" text-anchor="middle" fill="#b45309" font-weight="500">reply to the offer: the ids of the accepted files,</text>
<text x="460.0" y="676" font-size="12" text-anchor="middle" fill="#b45309" font-weight="500">with the header Yonder-Fetch: 1</text>
<polyline points="690,740 230,740" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="230,740 240.0,735.5 240.0,744.5" fill="#4f46e5"/>
<rect x="306.15999999999997" y="702" width="307.68" height="34" fill="#f6f7fb"/>
<text x="460.0" y="717" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">POST /api/yonder/v1/answer?sessionId=&lt;id&gt;:</text>
<text x="460.0" y="732" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">the same answer. A uses the first to arrive.</text>
<polyline points="690,781 230,781" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="230,781 240.0,776.5 240.0,785.5" fill="#4f46e5"/>
<rect x="329.68" y="758" width="260.64" height="19" fill="#f6f7fb"/>
<text x="460.0" y="773" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">GET /download?sessionId=&lt;id&gt;&amp;fileId=0</text>
<polyline points="230,822 690,822" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="690,822 680.0,826.5 680.0,817.5" fill="#4f46e5"/>
<rect x="403.6" y="799" width="112.80000000000001" height="19" fill="#f6f7fb"/>
<text x="460.0" y="814" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">reply: the file</text>
<rect x="561.76" y="840" width="256.48" height="29" rx="6" fill="#ffffff" stroke="#8a93a8" stroke-width="1.2"/>
<text x="690.0" y="859" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">Write the file to the save folder.</text>
<polyline points="690,908 230,908" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="230,908 240.0,903.5 240.0,912.5" fill="#4f46e5"/>
<rect x="275.91999999999996" y="885" width="368.16" height="19" fill="#f6f7fb"/>
<text x="460.0" y="900" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">POST /api/yonder/v1/fetched?sessionId=&lt;id&gt;&amp;complete=1</text>
<rect x="130.0" y="926" width="200.0" height="29" rx="6" fill="#ffffff" stroke="#8a93a8" stroke-width="1.2"/>
<text x="230.0" y="945" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">The send is complete.</text>
</svg>

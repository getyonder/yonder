<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 816" width="940" height="816" role="img" aria-label="How Yonder selects the path for a send" font-family="Figtree, Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>How Yonder selects the path for a send</title>
<rect width="940" height="816" rx="12" fill="#f6f7fb"/>
<rect x="170" y="24" width="260" height="46" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="300.0" y="52.0" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">The user selects a device and files</text>
<polyline points="300,70 300,100" fill="none" stroke="#1f2433" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="300,100 295.5,90.0 304.5,90.0" fill="#1f2433"/>
<rect x="170" y="100" width="260" height="50" rx="25.0" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="300.0" y="121.5" font-size="12.5" text-anchor="middle" fill="#1f2433" font-weight="600">Was the device seen on</text>
<text x="300.0" y="137.5" font-size="12.5" text-anchor="middle" fill="#1f2433" font-weight="600">the local network?</text>
<polyline points="430,125 560,125" fill="none" stroke="#0f7a55" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="560,125 550.0,129.5 550.0,120.5" fill="#0f7a55"/>
<rect x="479.34" y="106.5" width="31.32" height="18.5" fill="#f6f7fb"/>
<text x="495" y="121.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="500">yes</text>
<rect x="560" y="96" width="330" height="58" rx="8" fill="#e3f5ec" stroke="#0f7a55" stroke-width="1.5"/>
<text x="725.0" y="122.5" font-size="13.5" text-anchor="middle" fill="#0f7a55" font-weight="650">Send on the local network</text>
<text x="725.0" y="138.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">try each known address in turn</text>
<polyline points="725,154 725,190" fill="none" stroke="#0f7a55" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="725,190 720.5,180.0 729.5,180.0" fill="#0f7a55"/>
<rect x="610" y="190" width="230" height="50" rx="25.0" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="725.0" y="219.5" font-size="12.5" text-anchor="middle" fill="#1f2433" font-weight="600">Was a connection made?</text>
<polyline points="840,215 890,215 890,286" fill="none" stroke="#0f7a55" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="890,286 885.5,276.0 894.5,276.0" fill="#0f7a55"/>
<rect x="874.34" y="243.5" width="31.32" height="18.5" fill="#f6f7fb"/>
<text x="890" y="258.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="500">yes</text>
<rect x="830" y="286" width="90" height="44" rx="8" fill="#e3f5ec" stroke="#0f7a55" stroke-width="1.5"/>
<text x="875.0" y="313.0" font-size="13.5" text-anchor="middle" fill="#0f7a55" font-weight="650">Sent</text>
<polyline points="725,240 725,286" fill="none" stroke="#1f2433" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="725,286 720.5,276.0 729.5,276.0" fill="#1f2433"/>
<rect x="712.56" y="253.5" width="24.880000000000003" height="18.5" fill="#f6f7fb"/>
<text x="725" y="268.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="500">no</text>
<rect x="630" y="286" width="190" height="44" rx="22.0" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="725.0" y="312.5" font-size="12.5" text-anchor="middle" fill="#1f2433" font-weight="600">Is the device paired?</text>
<polyline points="725,330 725,368" fill="none" stroke="#1f2433" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="725,368 720.5,358.0 729.5,358.0" fill="#1f2433"/>
<rect x="712.56" y="339.5" width="24.880000000000003" height="18.5" fill="#f6f7fb"/>
<text x="725" y="354.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="500">no</text>
<rect x="630" y="368" width="190" height="44" rx="8" fill="#ffffff" stroke="#b42318" stroke-width="1.5"/>
<text x="725.0" y="395.0" font-size="13.5" text-anchor="middle" fill="#b42318" font-weight="650">Message: not reached</text>
<polyline points="630,308 490,308 490,249 450,249" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="450,249 460.0,244.5 460.0,253.5" fill="#4f46e5"/>
<rect x="505.7" y="317.0" width="108.60000000000001" height="33.0" fill="#f6f7fb"/>
<text x="560" y="331.5" font-size="11.5" text-anchor="middle" fill="#4f46e5" font-weight="500">yes: the tunnel</text>
<text x="560" y="346.0" font-size="11.5" text-anchor="middle" fill="#4f46e5" font-weight="500">is the backup</text>
<polyline points="300,150 300,216" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="300,216 295.5,206.0 304.5,206.0" fill="#4f46e5"/>
<rect x="229.6" y="175.5" width="140.8" height="18.5" fill="#f6f7fb"/>
<text x="300" y="190.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="500">no (a paired device)</text>
<rect x="150" y="216" width="300" height="66" rx="8" fill="#ecebff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="300.0" y="239.0" font-size="13.5" text-anchor="middle" fill="#4f46e5" font-weight="650">Reach the device through the tunnel</text>
<text x="300.0" y="255.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">GET /info at the stored address, then</text>
<text x="300.0" y="270.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">on the other relays in the list (figure 9)</text>
<polyline points="300,282 300,330" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="300,330 295.5,320.0 304.5,320.0" fill="#4f46e5"/>
<rect x="190" y="330" width="220" height="46" rx="23.0" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="300.0" y="357.5" font-size="12.5" text-anchor="middle" fill="#1f2433" font-weight="600">Did the device answer?</text>
<polyline points="190,353 95,353 95,398" fill="none" stroke="#1f2433" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="95,398 90.5,388.0 99.5,388.0" fill="#1f2433"/>
<rect x="127.56" y="334.5" width="24.880000000000003" height="18.5" fill="#f6f7fb"/>
<text x="140" y="349.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="500">no</text>
<rect x="20" y="398" width="150" height="44" rx="8" fill="#ffffff" stroke="#b42318" stroke-width="1.5"/>
<text x="95.0" y="425.0" font-size="13.5" text-anchor="middle" fill="#b42318" font-weight="650">Message: offline</text>
<polyline points="300,376 300,430" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="300,430 295.5,420.0 304.5,420.0" fill="#4f46e5"/>
<rect x="284.34" y="393.5" width="31.32" height="18.5" fill="#f6f7fb"/>
<text x="300" y="408.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="500">yes</text>
<rect x="180" y="430" width="240" height="50" rx="25.0" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="300.0" y="451.5" font-size="12.5" text-anchor="middle" fill="#1f2433" font-weight="600">Is one of the two devices</text>
<text x="300.0" y="467.5" font-size="12.5" text-anchor="middle" fill="#1f2433" font-weight="600">a browser?</text>
<polyline points="420,455 560,455" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="560,455 550.0,459.5 550.0,450.5" fill="#4f46e5"/>
<rect x="474.34" y="436.5" width="31.32" height="18.5" fill="#f6f7fb"/>
<text x="490" y="451.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="500">yes</text>
<rect x="560" y="418" width="330" height="74" rx="8" fill="#ecebff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="725.0" y="445.0" font-size="13.5" text-anchor="middle" fill="#4f46e5" font-weight="650">Send on a data channel (figure 5)</text>
<text x="725.0" y="461.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">direct between the two devices; if none</text>
<text x="725.0" y="476.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">forms in 30 seconds: stop</text>
<polyline points="300,480 300,540" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="300,540 295.5,530.0 304.5,530.0" fill="#4f46e5"/>
<rect x="252.14" y="499.5" width="95.72000000000001" height="18.5" fill="#f6f7fb"/>
<text x="300" y="514.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="500">no (two apps)</text>
<rect x="170" y="540" width="260" height="50" rx="25.0" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="300.0" y="561.5" font-size="12.5" text-anchor="middle" fill="#1f2433" font-weight="600">Is one of the two connections</text>
<text x="300.0" y="577.5" font-size="12.5" text-anchor="middle" fill="#1f2433" font-weight="600">direct in 10 seconds or less?</text>
<polyline points="170,565 130,565 130,612" fill="none" stroke="#1f2433" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="130,612 125.5,602.0 134.5,602.0" fill="#1f2433"/>
<rect x="137.56" y="546.5" width="24.880000000000003" height="18.5" fill="#f6f7fb"/>
<text x="150" y="561.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="500">no</text>
<rect x="30" y="612" width="200" height="58" rx="8" fill="#ffffff" stroke="#b42318" stroke-width="1.5"/>
<text x="130.0" y="638.5" font-size="13.5" text-anchor="middle" fill="#b42318" font-weight="650">Stop</text>
<text x="130.0" y="654.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">message: no direct path</text>
<polyline points="300,590 300,646" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="300,646 295.5,636.0 304.5,636.0" fill="#4f46e5"/>
<rect x="284.34" y="607.5" width="31.32" height="18.5" fill="#f6f7fb"/>
<text x="300" y="622.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="500">yes</text>
<rect x="250" y="646" width="330" height="74" rx="8" fill="#ecebff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="415.0" y="673.0" font-size="13.5" text-anchor="middle" fill="#4f46e5" font-weight="650">Send on the direct connection</text>
<text x="415.0" y="689.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">of the sender, or if not, of the receiver (figure 4);</text>
<text x="415.0" y="704.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">a guard examines its path each 3 seconds</text>
<polyline points="415,720 415,754" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="415,754 410.5,744.0 419.5,744.0" fill="#4f46e5"/>
<rect x="250" y="754" width="330" height="44" rx="8" fill="#ffffff" stroke="#b42318" stroke-width="1.5"/>
<text x="415.0" y="781.0" font-size="13.5" text-anchor="middle" fill="#b42318" font-weight="650">On the relay 2 times in sequence: stop</text>
</svg>

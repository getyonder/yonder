<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 878" width="920" height="878" role="img" aria-label="A transfer with a web app: the files go on a data channel, direct between the two devices" font-family="Figtree, Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>A transfer with a web app: the files go on a data channel, direct between the two devices</title>
<rect width="920" height="878" rx="12" fill="#f6f7fb"/>
<line x1="230" y1="66" x2="230" y2="856" stroke="#8a93a8" stroke-width="1.2" stroke-dasharray="3 4"/>
<line x1="690" y1="66" x2="690" y2="856" stroke="#8a93a8" stroke-width="1.2" stroke-dasharray="3 4"/>
<rect x="120" y="18" width="220" height="50" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="230.0" y="40.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">Device A</text>
<text x="230.0" y="56.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the sender</text>
<rect x="580" y="18" width="220" height="50" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="690.0" y="40.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">Device B</text>
<text x="690.0" y="56.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the receiver</text>
<rect x="110" y="100" width="700" height="44" rx="6" fill="#ffffff" stroke="#8a93a8" stroke-width="1.2"/>
<text x="460.0" y="119" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">One of the two devices is a web app. Amber, dashed: the tunnel connection of A to B, which can be on the relay.</text>
<text x="460.0" y="134" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">It carries small messages only. Indigo: the data channel, direct between the two devices. It carries the files.</text>
<polyline points="230,183 690,183" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round"/>
<polygon points="690,183 680.0,187.5 680.0,178.5" fill="#b45309"/>
<rect x="423.76" y="160" width="72.48" height="19" fill="#f6f7fb"/>
<text x="460.0" y="175" font-size="12" text-anchor="middle" fill="#b45309" font-weight="500">GET /info</text>
<polyline points="690,224 230,224" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round"/>
<polygon points="230,224 240.0,219.5 240.0,228.5" fill="#b45309"/>
<rect x="312.88" y="201" width="294.24" height="19" fill="#f6f7fb"/>
<text x="460.0" y="216" font-size="12" text-anchor="middle" fill="#b45309" font-weight="500">reply: the type of the device (web or not)</text>
<rect x="71.51999999999998" y="242" width="316.96000000000004" height="44" rx="6" fill="#ffffff" stroke="#8a93a8" stroke-width="1.2"/>
<text x="230.0" y="261" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">Make the description of A (an offer).</text>
<text x="230.0" y="276" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">Ask the STUN server for the public address.</text>
<polyline points="230,325 690,325" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round"/>
<polygon points="690,325 680.0,329.5 680.0,320.5" fill="#b45309"/>
<rect x="292.71999999999997" y="302" width="334.56000000000006" height="19" fill="#f6f7fb"/>
<text x="460.0" y="317" font-size="12" text-anchor="middle" fill="#b45309" font-weight="500">POST /api/yonder/v1/direct: the description of A</text>
<rect x="531.52" y="343" width="316.96000000000004" height="44" rx="6" fill="#ffffff" stroke="#8a93a8" stroke-width="1.2"/>
<text x="690.0" y="362" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">Answer only a paired device, in the tunnel.</text>
<text x="690.0" y="377" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">Ask the STUN server for the public address.</text>
<polyline points="690,426 230,426" fill="none" stroke="#b45309" stroke-width="1.8" stroke-dasharray="6 4" stroke-linejoin="round"/>
<polygon points="230,426 240.0,421.5 240.0,430.5" fill="#b45309"/>
<rect x="363.28" y="403" width="193.44000000000003" height="19" fill="#f6f7fb"/>
<text x="460.0" y="418" font-size="12" text-anchor="middle" fill="#b45309" font-weight="500">reply: the description of B</text>
<rect x="16" y="446" width="888" height="28" rx="6" fill="#eceff6" stroke="none" stroke-width="1.5"/>
<text x="460.0" y="465" font-size="12.5" text-anchor="middle" fill="#1f2433" font-weight="650">The two devices connect directly: a maximum of 30 seconds from the offer</text>
<polyline points="230,528 690,528" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="690,528 680.0,532.5 680.0,523.5" fill="#4f46e5"/>
<rect x="319.6" y="490" width="280.8" height="34" fill="#f6f7fb"/>
<text x="460.0" y="505" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">connection checks (ICE), then DTLS with</text>
<text x="460.0" y="520" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">the fingerprints of the two descriptions</text>
<rect x="110" y="546" width="700" height="29" rx="6" fill="#ffffff" stroke="#8a93a8" stroke-width="1.2"/>
<text x="460.0" y="565" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">If no data channel opens in the 30 seconds, the send stops. No file goes through the relay.</text>
<polyline points="230,629 690,629" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="690,629 680.0,633.5 680.0,624.5" fill="#4f46e5"/>
<rect x="336.4" y="591" width="247.20000000000002" height="34" fill="#f6f7fb"/>
<text x="460.0" y="606" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">TLS in the channel: each end proves</text>
<text x="460.0" y="621" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">the certificate of the pairing</text>
<polyline points="230,670 690,670" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="690,670 680.0,674.5 680.0,665.5" fill="#4f46e5"/>
<rect x="322.96" y="647" width="274.08000000000004" height="19" fill="#f6f7fb"/>
<text x="460.0" y="662" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">POST /prepare-upload: the list of files</text>
<rect x="590.0" y="688" width="200.0" height="29" rx="6" fill="#ffffff" stroke="#8a93a8" stroke-width="1.2"/>
<text x="690.0" y="707" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">Ask the owner.</text>
<polyline points="690,756 230,756" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="230,756 240.0,751.5 240.0,760.5" fill="#4f46e5"/>
<rect x="370.0" y="733" width="180.00000000000003" height="19" fill="#f6f7fb"/>
<text x="460.0" y="748" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">reply: the accepted files</text>
<polyline points="230,797 690,797" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="690,797 680.0,801.5 680.0,792.5" fill="#4f46e5"/>
<rect x="376.72" y="774" width="166.56" height="19" fill="#f6f7fb"/>
<text x="460.0" y="789" font-size="12" text-anchor="middle" fill="#4f46e5" font-weight="500">POST /upload: each file</text>
<rect x="64.79999999999998" y="815" width="330.4000000000001" height="29" rx="6" fill="#ffffff" stroke="#8a93a8" stroke-width="1.2"/>
<text x="230.0" y="834" font-size="12" text-anchor="middle" fill="#1f2433" font-weight="400">The send is complete. Close the data channel.</text>
</svg>

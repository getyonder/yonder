<text x="448.0" y="441.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">records, link,</text>
<text x="448.0" y="456.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">exchange</text>

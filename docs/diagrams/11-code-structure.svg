<text x="330.0" y="441.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">data channels: the</text>
<text x="330.0" y="456.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">only user of pion</text>
<polyline points="330,366 330,400" fill="none" stroke="#1f2433" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="330,400 325.5,390.0 334.5,390.0" fill="#1f2433"/>

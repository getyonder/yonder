<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 736" width="1250" height="736" role="img" aria-label="The structure of the code: two shells, one interface, one core, and the server programs" font-family="Figtree, Inter, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
<title>The structure of the code: two shells, one interface, one core, and the server programs</title>
<rect width="1250" height="736" rx="12" fill="#f6f7fb"/>
<text x="40" y="34" font-size="13" text-anchor="start" fill="#5b6478" font-weight="650">On a device</text>
<rect x="40" y="46" width="280" height="62" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="180.0" y="67.0" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">cmd/yonder</text>
<text x="180.0" y="83.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">desktop shell: Wails window, tray;</text>
<text x="180.0" y="98.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">terminal commands (internal/control)</text>
<rect x="340" y="46" width="280" height="62" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="480.0" y="74.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">cmd/yonder-web</text>
<text x="480.0" y="90.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">browser shell: WebAssembly</text>
<rect x="40" y="132" width="580" height="62" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5"/>
<text x="330.0" y="160.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">The interface (cmd/yonder/frontend)</text>
<text x="330.0" y="176.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">index.html, app.js, app.css; each shell supplies bridge.js and shell.css</text>
<rect x="40" y="218" width="580" height="62" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="330.0" y="246.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">internal/gui</text>
<text x="330.0" y="262.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">Service: all that the interface does. Sends the full State after each change.</text>
<rect x="40" y="304" width="580" height="62" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="330.0" y="332.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">internal/app</text>
<text x="330.0" y="348.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">Node: one Yonder in operation, with no interface. Path rule: direct.go</text>

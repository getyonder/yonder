<polygon points="795,136 790.5,126.0 799.5,126.0" fill="#1f2433"/>
<text x="795" y="365" font-size="11" text-anchor="middle" fill="#b45309" font-weight="400">and derper, the relay: not changed;</text>
<text x="795" y="378" font-size="11" text-anchor="middle" fill="#b45309" font-weight="400">the website and the web app: plain files</text>
<rect x="960" y="20" width="260" height="214" rx="10" fill="#fdf1dc" stroke="#b45309" stroke-width="1.5"/>
<text x="980" y="46" font-size="13" text-anchor="start" fill="#b45309" font-weight="650">On Yonder's server: STUN</text>
<rect x="980" y="60" width="220" height="56" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="1090.0" y="78.0" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">cmd/yonder-stun</text>
<text x="1090.0" y="94.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">tells a device its</text>
<text x="1090.0" y="109.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">public address</text>
<rect x="980" y="136" width="220" height="62" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5"/>
<text x="1090.0" y="157.0" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">stun</text>
<text x="1090.0" y="173.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the answer to a request,</text>

<text x="212.0" y="539.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">external library</text>
<polyline points="212,470 212,500" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="212,500 207.5,490.0 216.5,490.0" fill="#4f46e5"/>
<rect x="280" y="500" width="120" height="52" rx="8" fill="#ecebff" stroke="#4f46e5" stroke-width="1.5"/>
<text x="340.0" y="523.5" font-size="13.5" text-anchor="middle" fill="#4f46e5" font-weight="650">pion/webrtc</text>
<text x="340.0" y="539.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">external library</text>
<polyline points="330,470 330,500" fill="none" stroke="#4f46e5" stroke-width="1.8" stroke-linejoin="round"/>
<polygon points="330,500 325.5,490.0 334.5,490.0" fill="#4f46e5"/>
<rect x="660" y="396" width="270" height="320" rx="10" fill="#eceff6" stroke="#8a93a8" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="680" y="420" font-size="13" text-anchor="start" fill="#5b6478" font-weight="650">Also used by internal/gui</text>
<rect x="680" y="432" width="230" height="40" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5"/>
<text x="795.0" y="449.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">nearby</text>
<text x="795.0" y="465.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">meeting point client, key agreement</text>
<rect x="680" y="478" width="230" height="40" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5"/>
<text x="795.0" y="495.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">settings</text>
<text x="795.0" y="511.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">name, save folder, selections</text>
<rect x="680" y="524" width="230" height="40" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5"/>
<text x="795.0" y="541.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">firewall</text>
<text x="795.0" y="557.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the firewall notice</text>
<rect x="680" y="570" width="230" height="40" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5"/>
<text x="795.0" y="587.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">tally/agent</text>
<text x="795.0" y="603.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the text of the update check</text>
<rect x="680" y="616" width="230" height="40" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5"/>
<text x="795.0" y="633.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">withdrawn</text>
<text x="795.0" y="649.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the signed list of withdrawn versions</text>
<rect x="680" y="662" width="230" height="40" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5"/>
<text x="795.0" y="679.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">address</text>
<text x="795.0" y="695.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the addresses built into the app</text>
<text x="40" y="620" font-size="12" text-anchor="start" fill="#5b6478" font-weight="400" font-style="italic">The names in the lower rows are packages in internal/. The exceptions are tailcat and pion/webrtc.</text>
<text x="40" y="638" font-size="12" text-anchor="start" fill="#5b6478" font-weight="400" font-style="italic">The packages pairing, tunnel and nearby also use address.</text>
<text x="40" y="656" font-size="12" text-anchor="start" fill="#5b6478" font-weight="400" font-style="italic">The packages localsend, pairing and nearby use names: the rule for a name from a different device.</text>
<text x="40" y="674" font-size="12" text-anchor="start" fill="#5b6478" font-weight="400" font-style="italic">The packages app, localsend, direct and firewall use ownroute: the tie of a socket to its interface (Linux).</text>
<rect x="660" y="20" width="270" height="364" rx="10" fill="#fdf1dc" stroke="#b45309" stroke-width="1.5"/>
<text x="680" y="46" font-size="13" text-anchor="start" fill="#b45309" font-weight="650">On Yonder's server</text>
<rect x="680" y="60" width="230" height="56" rx="8" fill="#ffffff" stroke="#1f2433" stroke-width="1.5"/>
<text x="795.0" y="78.0" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">cmd/yonder-api</text>
<text x="795.0" y="94.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the service that the apps</text>
<text x="795.0" y="109.0" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">and the web app call</text>
<rect x="680" y="136" width="230" height="48" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5"/>
<text x="795.0" y="157.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">meeting</text>
<text x="795.0" y="173.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the meeting point</text>
<rect x="680" y="192" width="230" height="48" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5"/>
<text x="795.0" y="213.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">tally</text>
<text x="795.0" y="229.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the totals of each day, in SQLite</text>
<rect x="680" y="248" width="230" height="48" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5"/>
<text x="795.0" y="269.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">usage</text>
<text x="795.0" y="285.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the monthly limit</text>
<rect x="680" y="304" width="230" height="48" rx="8" fill="#ffffff" stroke="#8a93a8" stroke-width="1.5"/>
<text x="795.0" y="325.5" font-size="13.5" text-anchor="middle" fill="#1f2433" font-weight="650">proxyline</text>
<text x="795.0" y="341.5" font-size="11.5" text-anchor="middle" fill="#5b6478" font-weight="400">the address of the visitor</text>
